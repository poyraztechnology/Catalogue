<style>
:root{--band:#1F1A16;--ink:#1E1A16;--muted:#6C635A;--bg:#F5F2ED;--line:#CFC5B6;--accent:#8A5A2B;--bad:#B23A2B}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
.band{background:#FFFFFF;color:#14213D;border-bottom:1px solid #E2DBD0}.band .in{max-width:520px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:12px}
.brand{display:block}.brand img{display:block;height:46px;width:auto}.private{margin-left:auto;font:700 11px/1 Arial,sans-serif;letter-spacing:.12em;background:#9B3326;color:#fff;padding:7px 10px;border-radius:4px}
main{max-width:520px;margin:0 auto;padding:40px 20px}
form{background:#fff;border:1px solid #E2DBD0;border-radius:12px;padding:26px}
h1{font:800 28px/1.15 "Helvetica Neue",Arial,sans-serif;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px}
input[type=password]{width:100%;font:16px/1.3 inherit;padding:13px 14px;border:1px solid var(--line);border-radius:8px}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--muted);font-size:14px}
button{width:100%;font:700 16px/1 "Helvetica Neue",Arial,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:15px;cursor:pointer}
#m{color:var(--bad);margin-top:12px;min-height:1.4em;font-weight:600}
</style>
</head>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function key(pass, salt){
  const b = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256'}, b, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
}
async function openDesk(pass, remember){
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub(IV)}, await key(pass, ub(SALT)), ub(CT));
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if (remember) { try { localStorage.setItem('poyraz-desk-pass', pass); } catch (e) {} }
  document.open(); document.write(html); document.close();
}
(async () => {
  let s = null; try { s = localStorage.getItem('poyraz-desk-pass'); } catch (e) {}
  if (s) { try { await openDesk(s, false); return; } catch (e) { try { localStorage.removeItem('poyraz-desk-pass'); } catch (_) {} } }
  document.getElementById('p').focus();
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault(); const m = document.getElementById('m'); m.textContent = '';
  try { await openDesk(document.getElementById('p').value, document.getElementById('r').checked); }
  catch (e) { m.textContent = 'Şifre yanlış / Wrong password'; }
});
