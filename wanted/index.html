<style>[hidden]{display:none!important} img{max-width:100%}/* Layout: dark brand band, intro with key figures, sticky search + category chips, one grouped product ledger, terms footer. */
:root{
  --band:#1F1A16; --band-ink:#F4EEE6; --band-muted:#B9AC9C;
  --bg:#F5F2ED; --surface:#FFFFFF; --ink:#1E1A16; --muted:#6C635A; --line:#E2DBD0; --line-strong:#CFC5B6;
  --accent:#8A5A2B; --accent-ink:#FFFFFF; --accent-soft:#F2E8DA; --chip:#F1EDE7;
  --ok:#2E7550; --okbg:#E3F1E8; --amber:#9C640A; --amberbg:#FAEFD7; --greybg:#EFEBE5; --bad:#B23A2B; --badbg:#F8E1DD;
  --mark:#FFE59A; --private:#9B3326;
  --f-head:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#0F0D0B; --band-ink:#F4EEE6; --band-muted:#A69886;
  --bg:#151311; --surface:#1E1B18; --ink:#EFE9E1; --muted:#A39A8F; --line:#34302A; --line-strong:#4A433B;
  --accent:#DBA770; --accent-ink:#1A1410; --accent-soft:#2D251D; --chip:#26221E;
  --ok:#86CFA2; --okbg:#1C3325; --amber:#E8BE6C; --amberbg:#392D15; --greybg:#2A2622; --bad:#F2917F; --badbg:#3D211C;
  --mark:#6B5521; --private:#C0503F; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#0F0D0B; --band-ink:#F4EEE6; --band-muted:#A69886;
  --bg:#151311; --surface:#1E1B18; --ink:#EFE9E1; --muted:#A39A8F; --line:#34302A; --line-strong:#4A433B;
  --accent:#DBA770; --accent-ink:#1A1410; --accent-soft:#2D251D; --chip:#26221E;
  --ok:#86CFA2; --okbg:#1C3325; --amber:#E8BE6C; --amberbg:#392D15; --greybg:#2A2622; --bad:#F2917F; --badbg:#3D211C;
  --mark:#6B5521; --private:#C0503F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; margin:0}
.band{--band:#FFFFFF; --band-ink:#14213D; --band-muted:#5F6B7A; background:#FFFFFF; color:#14213D; border-bottom:1px solid #E2DBD0; padding-inline:16px; color-scheme:light}
.band .in{max-width:1320px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; flex-wrap:wrap}
.mark{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.mark img.logo{display:block; height:64px; width:auto}
.mark span{padding-left:14px; border-left:1px solid #D5DCE6}
@media (max-width:640px){.mark img.logo{height:42px} .mark{gap:10px} .mark span{padding-left:10px}}
.mark b{font-family:var(--f-head); font-weight:800; font-size:20px; letter-spacing:.16em}
.mark span{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--band-muted)}
.right{display:flex; align-items:center; gap:10px}
.private{background:var(--private); color:#fff; font-size:11.5px; font-weight:700; letter-spacing:.1em; padding:5px 10px; border-radius:6px}
.lang{display:inline-flex; border:1px solid color-mix(in srgb, var(--band-ink) 30%, transparent); border-radius:8px; overflow:hidden}
.lang button{font:inherit; font-size:12.5px; font-weight:700; letter-spacing:.06em; padding:6px 12px; background:transparent; color:var(--band-muted); border:0; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--band-ink); color:var(--band)}
main{padding-inline:16px; padding-block:0 110px}
.wrap{max-width:1320px; margin:0 auto}
.intro{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:end; padding-block:28px 18px}
.intro h1{font-family:var(--f-head); font-weight:800; font-size:clamp(26px,3.6vw,38px); line-height:1.08; letter-spacing:-.015em; margin:0; text-wrap:balance}
.intro p{color:var(--muted); margin:10px 0 0; max-width:62ch}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden}
.stat{padding:12px 14px; border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .v{font-family:var(--f-head); font-weight:800; font-size:22px; font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.tools{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:10px; border-bottom:1px solid var(--line)}
.filters{display:grid; grid-template-columns:minmax(0,1fr) 230px 200px; gap:10px}
.filters.desk{grid-template-columns:minmax(0,1fr) 220px 200px 190px}
.search{position:relative}
.search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted)}
input[type=search],select{width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--line-strong); border-radius:10px}
input[type=search]{padding:12px 14px 12px 42px; font-size:16px}
select{padding:11px 12px; font-size:14px}
.chk{display:flex; align-items:center; gap:8px; font-size:13.5px; background:var(--surface); border:1.5px solid var(--line-strong); border-radius:10px; padding:0 12px}
input:focus,select:focus,button:focus-visible{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
.chips{display:flex; gap:6px; overflow-x:auto; padding-block:10px 2px; scrollbar-width:thin}
.chip{flex:none; font:inherit; font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap}
.chip .n{color:var(--muted); font-family:var(--f-mono); font-size:12px; margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit; opacity:.75}
.count{margin:16px 0 8px; font-size:13.5px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.count b{color:var(--ink)}
.linkbtn{font:inherit; font-size:13px; background:none; border:0; color:var(--accent); cursor:pointer; text-decoration:underline; padding:0}
.ledger{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.row{display:grid; gap:14px; align-items:start; padding:12px 16px; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.cat .row, .row.c{grid-template-columns:24px 64px minmax(0,1fr) 190px 210px 92px}
.row.c.cp{grid-template-columns:24px 64px minmax(0,1fr) 150px 196px 78px 124px}
.price{font-family:var(--f-mono); font-weight:700; font-size:14.5px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.price.ask{font-family:var(--f-body); font-weight:500; font-style:italic; color:var(--muted); font-size:13px}
.row.d{grid-template-columns:24px 64px minmax(0,1fr) 250px 112px 112px 78px}
.row.head{background:var(--accent-soft); font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); padding-block:10px}
.group{padding:14px 16px 8px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); display:flex; align-items:baseline; gap:10px}
.group:first-child{border-top:0}
.group h3{font-family:var(--f-head); font-size:15px; font-weight:800; margin:0; letter-spacing:.01em}
.group span{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.no{font-family:var(--f-mono); font-size:12.5px; color:var(--muted); padding-top:2px}
.pm{font-weight:600; font-size:15px; line-height:1.35}
.pmeta{font-family:var(--f-mono); font-size:12px; color:var(--muted); margin-top:3px; word-break:break-word}
.pd{font-size:13px; color:var(--muted); margin-top:3px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:999px; line-height:1.3}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.pill.ready{background:var(--okbg); color:var(--ok)} .pill.lead{background:var(--amberbg); color:var(--amber)} .pill.ask{background:var(--greybg); color:var(--muted)}
.cond{font-size:13px}
.sub{display:block; font-size:12.5px; color:var(--muted); margin-top:4px}
.qty{font-family:var(--f-mono); font-size:13.5px; font-variant-numeric:tabular-nums}
.lbl{display:none}
mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 1px}
.pick{appearance:none; width:20px; height:20px; border:1.5px solid var(--line-strong); border-radius:6px; background:var(--surface); cursor:pointer; margin-top:2px; display:grid; place-items:center}
.pick:checked{background:var(--accent); border-color:var(--accent)}
.pick:checked::after{content:""; width:5px; height:10px; border:solid var(--accent-ink); border-width:0 2px 2px 0; transform:rotate(45deg) translate(-1px,-1px)}
.row.sel{background:color-mix(in srgb, var(--accent) 6%, var(--surface))}
.more{display:block; width:100%; font:inherit; font-weight:600; padding:13px; border:0; border-top:1px solid var(--line); background:var(--accent-soft); color:var(--accent); cursor:pointer}
.empty{padding:44px 16px; text-align:center; color:var(--muted)}
.xm{margin:14px 0 4px; border:1px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:10px 14px}
.xm > summary{cursor:pointer; font-family:var(--f-head); font-weight:800; font-size:15.5px; color:var(--accent)}
.xm.none{border-style:dashed; background:transparent; color:var(--muted); font-size:13.5px}
.xl{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px 16px; margin-top:10px}
.xr{display:grid; grid-template-columns:62px minmax(0,1fr); gap:8px; padding:8px 0; border-top:1px solid color-mix(in srgb, var(--accent) 25%, transparent)}
.xr .no{font-family:var(--f-mono); font-size:12.5px; color:var(--muted)}
.terms{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:22px}
.term{border-top:2px solid var(--accent); padding-top:10px}
.term h4{margin:0 0 4px; font-family:var(--f-head); font-size:14px}
.term p{margin:0; font-size:13.5px; color:var(--muted)}
.contact{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin:0 0 16px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.contact h3{margin:0; font-family:var(--f-head); font-size:15px; font-weight:800}
.contact .who{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline}
.contact .nm2{font-weight:600}
.wa{font-family:var(--f-mono); font-size:14px; color:var(--accent); text-decoration:none; white-space:nowrap}
.wa:hover{text-decoration:underline}
.cc{font-family:var(--f-body); font-size:10px; color:var(--muted); margin-left:4px; letter-spacing:.02em; white-space:nowrap}
.b-wa{background:#25D366; color:#0B2E17}
.sup .full{font-size:12px; color:var(--muted); margin-top:-3px}
.sup .kind{justify-self:start; font-size:11px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--muted)}
.sup .kind.k1{background:var(--okbg); color:var(--ok)}
.sup .ph a{display:inline-block}
.foot{margin-top:22px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px}
.basket{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--band); color:var(--band-ink); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.basket .in{max-width:1320px; margin:0 auto; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.basket button{font:inherit; font-weight:700; border:0; border-radius:8px; padding:10px 16px; cursor:pointer}
.b-copy{background:var(--accent); color:var(--accent-ink)}
.b-clear{background:transparent; color:var(--band-ink); border:1px solid color-mix(in srgb, var(--band-ink) 40%, transparent)!important}
.copybox{width:100%; font-family:var(--f-mono); font-size:12.5px; min-height:120px; border-radius:8px; padding:10px; color:var(--ink); background:var(--surface); border:1px solid var(--line)}
/* desk */
.qpanel{position:fixed; left:0; right:0; bottom:0; z-index:8; max-height:86vh; overflow:auto; background:var(--surface); border-top:3px solid var(--accent); box-shadow:0 -12px 40px rgba(0,0,0,.18); padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.qin{max-width:1100px; margin:0 auto; display:grid; gap:12px}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:12px}
.qhead h2{margin:0; font-family:var(--f-head); font-size:20px}
.qfields{display:grid; grid-template-columns:1.2fr 1fr 1.4fr; gap:10px}
.qfields label, .qlbl{display:grid; gap:4px; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em}
.qin input[type=text], .qin input[inputmode], .qin textarea{font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line-strong); border-radius:8px; padding:9px 10px; width:100%; text-transform:none; letter-spacing:0; font-weight:400}
.ql{display:grid; grid-template-columns:minmax(0,1fr) 96px 130px 150px 32px; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.qp .pm{font-size:14px}
.qcost{display:block; font-size:12px; color:var(--muted); margin-top:3px}
.qlt{text-align:right; font-family:var(--f-mono); font-weight:600; font-size:14px}
.qlt small{display:block; font-weight:500; font-size:12px}
.qx{font:inherit; font-size:18px; line-height:1; width:30px; height:30px; border-radius:8px; border:1px solid var(--line-strong); background:var(--bg); color:var(--muted); cursor:pointer}
.qtot{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px 24px; border-top:2px solid var(--ink); padding-top:10px; font-family:var(--f-mono)}
.qtot b{font-size:17px}
.qact{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end}
.qact button{font:inherit; font-weight:700; border-radius:8px; padding:10px 16px; cursor:pointer}
.qbtn2{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong)}
.qmsg{font-size:13px; color:var(--muted)}
.qstart{font:inherit; font-size:13px; font-weight:700; color:var(--accent-ink); background:var(--accent); border:0; border-radius:8px; padding:7px 12px; cursor:pointer}
.dir{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-top:10px}
.sup{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:5px; align-content:start}
.sup .nm{font-family:var(--f-head); font-weight:800; font-size:16px}
.sup .ph{font-family:var(--f-mono); font-size:14px}
.sup .ph.missing{color:var(--amber); font-family:var(--f-body); font-size:13px; font-weight:600}
.sup .ct{font-size:12.5px; color:var(--muted)}
.sup button{justify-self:start; font:inherit; font-size:13px; font-weight:600; color:var(--accent); background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; margin-top:4px}
.sup.unknown{border-style:dashed}
details.panel{margin-top:18px; background:transparent}
details.panel > summary{cursor:pointer; font-family:var(--f-head); font-weight:800; font-size:18px; list-style:none}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary::before{content:"▸ "; color:var(--accent)}
details.panel[open] > summary::before{content:"▾ "}
.srcs{display:grid; gap:6px}
.src{font-size:13px}
.src .co{font-weight:700}
.src .pr{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.src .qn{color:var(--muted); font-size:12px}
.src.off{opacity:.6}
.src.unk .co{color:var(--amber)}
.num{text-align:right; font-variant-numeric:tabular-nums}
.sell{font-weight:800; font-size:15px; font-family:var(--f-mono)}
.sell small{display:block; font-family:var(--f-body); font-weight:600; font-size:11px; color:var(--amber)}
.ask{font-style:italic; color:var(--muted)}
.pos{color:var(--ok); font-weight:700; font-family:var(--f-mono)} .neg{color:var(--bad); font-weight:700; font-family:var(--f-mono)}
.pct{display:block; font-size:12px; font-weight:500}
.warn{display:inline-block; margin-top:6px; font-size:12px; font-weight:600; color:var(--amber); background:var(--amberbg); padding:2px 8px; border-radius:6px}
.warn.bad{color:var(--bad); background:var(--badbg)}
details.why{margin-top:6px; font-size:12.5px; color:var(--muted)}
details.why summary{cursor:pointer; color:var(--accent); font-weight:600}
details.why .en{display:block; margin-top:4px; font-size:12px; opacity:.85}
@media (max-width:960px){
  .intro{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .tools{position:static}
  .filters,.filters.desk{grid-template-columns:1fr 1fr}
  .search{grid-column:1/-1}
  .row.head{display:none}
  .row.c, .row.c.cp{grid-template-columns:24px minmax(0,1fr); grid-template-areas:"pick prod" "pick meta"; gap:6px 12px}
  .row.c .pickc{grid-area:pick} .row.c .prod{grid-area:prod} .row .no{display:none}
  .row.c .meta{grid-area:meta; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center}
  .row.c .price{font-size:15px} .row.c .price.ask{font-size:13px}
  .row.d{grid-template-columns:24px minmax(0,1fr) auto; grid-template-areas:"pick prod sell" "pick src src" "pick meta meta"; gap:8px 12px}
  .row.d .pickc{grid-area:pick} .row.d .prod{grid-area:prod}
  .ql{grid-template-columns:minmax(0,1fr) 1fr 1fr; grid-template-areas:"p p x" "q pr lt"}
  .ql .qp{grid-area:p} .ql .qx{grid-area:x; justify-self:end} .ql .qqf{grid-area:q} .ql .qprf{grid-area:pr} .ql .qlt{grid-area:lt}
  .qfields{grid-template-columns:1fr} .row.d .srcs{grid-area:src} .row.d .sellc{grid-area:sell} .row.d .meta{grid-area:meta; display:flex; gap:16px; flex-wrap:wrap}
  .lbl{display:inline; color:var(--muted); font-size:12px; margin-right:4px; font-family:var(--f-body); font-weight:400}
  .num{text-align:left}
  .terms{grid-template-columns:1fr}
}
@media (min-width:961px){ .row .meta{display:contents} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

  return nums.map(n => { const d = n.replace(/\D/g, ''); return `<span style="white-space:nowrap"><a class="wa" href="https://wa.me/${d}" target="_blank" rel="noopener">${esc(n.trim())}</a><span class="cc">${esc(ccOf(d))}</span></span>`; }).join('<br>');
}
const t = k => (T[L][k] ?? T.en[k] ?? k);
const tx = (kind, v) => L === 'tr' ? (TR[kind][v] ?? v) : v;
const cname = i => L === 'tr' ? CAT_TR[CATS[i]] : CATS[i];
const usd = n => 'USD ' + Math.round(n).toLocaleString(L === 'tr' ? 'tr-TR' : 'en-US');
/* search: any word, EN or TR, with or without Turkish letters, spaces or dashes (“rtx5080” = “RTX 5080”, “ecc” finds RDIMM) */
const nz = s => String(s ?? '').toLocaleLowerCase('tr').replace(/[ıi̇]/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c').replace(/[âà]/g, 'a').replace(/[″“”"]/g, ' ');
const cz = s => s.replace(/[\s\-_.\/·,()+:]+/g, '');
const SYN = [[/\b(l?rdimm|registered)\b/, 'ecc registered rdimm server sunucu ram memory bellek'], [/\b(dimm|sodimm|udimm)\b/, 'ram memory bellek'],
  [/\b(ssd|nvme|u\.2|m\.2)\b/, 'ssd disk storage depolama'], [/\b(hdd|exos|ironwolf|barracuda|skyhawk)\b|hard ?drive/, 'hdd harddisk hard disk sabit disk storage depolama'],
  [/\b(rtx|geforce|radeon|quadro|gpu)\b|\brx ?\d{4}|\b(h100|h200|l40s|l4|a100|b200|b300)\b/, 'gpu ekran karti graphics card vga'],
  [/\b(rtx|gtx|gt) ?\d{3,4}(?!\d)/, 'geforce nvidia'], [/\b(quadro|tesla|h100|h200|h20|l40s|l4|a100|b200|b300|rtx pro|rtx a\d{3,4})\b/, 'nvidia'],
  [/\brx ?\d{4}|\bradeon\b/, 'radeon amd'], [/\barc ?[ab]\d{3}|\b[ab][357][578]0\b/, 'intel arc'], [/\b(monitor|display)\b/, 'monitor ekran display'],
  [/\b(router|mesh|wi-?fi|starlink)\b/, 'router modem wifi ag network internet'], [/\b(airpods|headphone|earbuds|echo dot)\b/, 'kulaklik headphone ses audio'],
  [/\b(playstation|ps5|xbox|nintendo|vr2)\b/, 'konsol console oyun game'], [/\b(iphone|ipad|tablet)\b/, 'telefon phone tablet'],
  [/\b(macbook|laptop|notebook|thinkpad|vivobook|zenbook|omnibook|elitebook|ideapad|latitude)\b/, 'laptop notebook dizustu bilgisayar computer'],
  [/\b(toner|ink|printer|laserjet|mfp|ecotank|pixma)\b/, 'printer yazici toner murekkep']];
function hay(core, more){   /* synonyms come only from the product itself (not from notes) */
  const s = nz(core.join(' ')); let extra = '';
  SYN.forEach(([re, w]) => { if (re.test(s)) extra += ' ' + w; });
  const h = s + ' ' + extra + ' ' + nz((more || []).join(' ')); return [h, cz(h), s + ' ' + extra, cz(s + ' ' + extra)];
}
const tokens = v => nz(v).split(/\s+/).filter(Boolean).reduce((a, x) => {   /* “5070 ti”, “64 gb” → “5070ti”, “64gb” */
  if (a.length && /^[a-z]{1,2}$/.test(x) && /\d$/.test(a[a.length - 1])) a[a.length - 1] += x; else a.push(x); return a; }, []);
const NUMRE = {};
const reOf = x => NUMRE[x] || (NUMRE[x] = /^\d+$/.test(x) ? new RegExp('(^|[^0-9.])' + x + '(?!\\d)')     /* 37 ≠ 370, 2 ≠ 1.92 */
  : x.length <= 2 ? new RegExp('(^|[^a-z0-9])' + x + '(?![a-z0-9])')                                                       /* ti, oc, lp: whole word */
  : /^\d/.test(x) ? new RegExp('(^|[^0-9.])' + x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))                                 /* 2tb ≠ 1.92tb */
  : /^[a-z]{3}$/.test(x) ? new RegExp('(^|[^a-z0-9])' + x) : null);                                                    /* arc ≠ search */
const hit = (r, toks) => toks.every(x => { const re = reOf(x);
  return re ? (re.test(r.h) || (/^\d/.test(x) && x.length > 2 && !/^\d+$/.test(x) && re.test(r.hc))) : (r.h.includes(x) || r.hc.includes(cz(x))); });
DATA.forEach(r => {
  r.names = [];
  [r.h, r.hc] = hay([CATS[r.c], r.b, r.m, r.p], [r.d, r.i, CAT_TR[CATS[r.c]], CW[CATS[r.c]] || '', r.k, TR.cond[r.k] || '', r.l, TR.loc[r.l] || '', r.t, TR.lead[r.t] || '', r.names.join(' '), r.w || '', r.n || '']);
});
XD.forEach(r => { let a; [r.h, r.hc, ...a] = hay([CATS[r.c], r.b, r.m, r.p], [r.d, r.i, CAT_TR[CATS[r.c]], CW[CATS[r.c]] || '', r.k, r.t, (r.sup || []).join(' '), r.w || '', r.n || '']);
  r.core = {h: a[0], hc: a[1]}; const nm = nz([r.b, r.m, r.p].join(' ')); r.name = {h: nm, hc: cz(nm)}; });
function xmatch(toks){
  const box = $('#xmatch'); if (!box) return;
  if (!XD.length || !toks.length) { box.innerHTML = ''; return; }
  const m = XD.filter(r => hit(r, toks)).map((r, i) => [hit(r.name, toks) ? 0 : hit(r.core, toks) ? 1 : 2, i, r]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);  /* product-name matches first */
  if (!m.length) { box.innerHTML = `<div class="xm none">${t('x_none')}</div>`; return; }
  const line = r => MODE === 'desk'
    ? `${t('x_qty')}: <b>${esc(tx('qty', r.q) || '—')}</b>${r.w ? ` · ${t('x_for')}: <b>${hl(r.w, toks)}</b>` : ''}${r.x != null ? ` · ${t('x_max')}: <b>${usd(r.x)}</b>` : ''}${r.t ? ' · ' + esc(tx('lead', r.t)) : ''}`
    : `${t('x_qty')}: <b>${esc(tx('qty', r.q) || '—')}</b>${r.s != null ? ` · ${t('x_sell')}: <b>${usd(r.s)}</b>` : ` · ${t('x_onreq')}`}${r.k ? ' · ' + esc(tx('cond', r.k)) : ''}${(r.sup || []).length ? ` · ${t('x_from')}: ${hl(r.sup.join(', '), toks)}` : ''}`;
  box.innerHTML = `<details class="xm" open><summary>${t('x_title').replace('{n}', m.length)}</summary><div class="xl">` +
    m.slice(0, 80).map(r => `<div class="xr"><span class="no">${r.i}</span><div><div class="pm">${hl(r.m, toks)}</div>` +
      `${r.p ? `<div class="pmeta">P/N ${hl(r.p, toks)}</div>` : ''}<div class="pd">${line(r)}</div>${MODE === 'desk' && r.n ? `<div class="pd">${hl(r.n, toks)}</div>` : ''}</div></div>`).join('') +
    (m.length > 80 ? `<div class="pd">+ ${m.length - 80}</div>` : '') + '</div></details>';
}
let cat = '', limit = 160;
const picked = new Set();
function hl(text, toks){
  let s = esc(text); if (!toks.length || !s) return s;
  const re = new RegExp('(' + toks.map(x => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}
function staticText(){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = t(e.dataset.t));
  $('#q').placeholder = t('search'); $('#q').setAttribute('aria-label', t('search'));
  $('#reset').textContent = t('reset');
  $('#l-en').setAttribute('aria-pressed', L === 'en'); $('#l-tr').setAttribute('aria-pressed', L === 'tr');
  const a = $('#avail').value; $('#avail').innerHTML = ['', 'ready', 'lead', 'ask'].map(v => `<option value="${v}">${t('av_' + (v || 'all'))}</option>`).join(''); $('#avail').value = a;
  const s2 = $('#sel2').value;
  {
    const brands = [...new Set(DATA.map(r => r.b).filter(Boolean))].sort((x, y) => x.localeCompare(y));
    $('#sel2').innerHTML = `<option value="">${t('allbrands')}</option>` + brands.map(b => `<option>${esc(b)}</option>`).join('');
    $('#bclear').textContent = t('bclear');
  }
  $('#sel2').value = s2; $('#sel2').setAttribute('aria-label', t('allbrands'));
  if ($('#contact')) $('#contact').innerHTML = `<h3>${t('contact_h')}</h3>` + CONTACTS.map(c => `<span class="who"><span class="nm2">${esc(c.name)}</span>${phonesHTML(c.tel)}</span>`).join('');
  if ($('#bwa') && MODE !== 'wtbdesk') $('#bwa').innerHTML = CONTACTS.map((c, i) => `<button class="b-wa" type="button" data-wa="${i}">${esc(t('wa_send').replace('{n}', c.short))}</button>`).join('');
  $('#terms').innerHTML = T[L].terms.map(([h, p]) => `<div class="term"><h4>${h}</h4><p>${p}</p></div>`).join('');
  stats(); chips(); basket();
}
function stats(){
  let v;
  {
    v = [[DATA.length, t('st_products')], [new Set(DATA.map(r => r.c)).size, t('st_groups')], [DATA.filter(r => r.a === 'ready').length, t('st_ready')], [new Set(DATA.map(r => r.b).filter(Boolean)).size, t('st_brands')]];
  }
  $('#stats').innerHTML = v.map(([n, k]) => `<div class="stat"><div class="v">${n.toLocaleString(L === 'tr' ? 'tr-TR' : 'en-US')}</div><div class="k">${k}</div></div>`).join('');
}
function chips(){
  const counts = CATS.map((_, i) => DATA.filter(r => r.c === i).length);
  $('#chips').innerHTML = `<button class="chip" type="button" data-c="" aria-pressed="${cat === ''}">${t('allgroups')}<span class="n">${DATA.length}</span></button>` +
    CATS.map((_, i) => counts[i] ? `<button class="chip" type="button" data-c="${i}" aria-pressed="${cat === String(i)}">${esc(cname(i))}<span class="n">${counts[i]}</span></button>` : '').join('');
}
function privLine(r, toks){
  return `<div class="pd" style="margin-top:7px;color:var(--accent)"><b>${t('lbl_who')}:</b> ${r.w ? hl(r.w, toks) : '—'}${r.x != null ? ` · <b>${t('lbl_target')}:</b> ${usd(r.x)}` : ''}${r.off ? ` · <span class="pill ask">${t('lbl_off')}</span>` : ''}</div>` +
    (r.n ? `<div class="pd" style="margin-top:3px">${hl(r.n, toks)}</div>` : '');
}
function availPill(r){ if (MODE.startsWith('wtb')) return r.t ? `<span class="pill lead">${esc(tx('lead', r.t))}</span>` : '<span class="pd" style="margin:0">—</span>';
  return `<span class="pill ${r.a}">${esc(r.t ? tx('lead', r.t) : t('av_ask_short'))}</span>`; }
function render(){
  const toks = tokens($('#q').value);
  const s2 = $('#sel2').value, av = $('#avail').value, w = false;
  const res = DATA.filter(r => (cat === '' || r.c === +cat) && (av === '' || r.a === av) &&
    (s2 === '' || (r.b === s2)) && (!w || r.chk !== 'OK') && hit(r, toks));
  const head = `<div class="row c${PRICED ? ' cp' : ''} head"><span></span><span>${t('h_no')}</span><span>${t('h_prod')}</span><span>${t('h_cond')}</span><span>${t('h_avail')}</span><span>${t('h_qty')}</span>${PRICED ? `<span style="text-align:right">${t('h_price')}</span>` : ''}</div>`;
  let out = '', last = -1;
  res.slice(0, limit).forEach(r => {
    if (r.c !== last) { last = r.c; const n = res.filter(x => x.c === r.c).length;
      out += `<div class="group"><h3>${esc(cname(r.c))}</h3><span>${n} ${t('products_l')}</span></div>` + head; }
    const meta = [r.b, r.p ? 'P/N ' + r.p : ''].filter(Boolean).join(' · ');
    const prod = `<div class="pm">${hl(r.m, toks)}</div>${meta ? `<div class="pmeta">${hl(meta, toks)}</div>` : ''}${r.d ? `<div class="pd">${hl(r.d, toks)}</div>` : ''}${MODE === 'wtbdesk' ? privLine(r, toks) : ''}`;
    {
      out += `<div class="row c${PRICED ? ' cp' : ''}${picked.has(r.i) ? ' sel' : ''}">
        <span class="pickc"><input class="pick" type="checkbox" id="p-${r.i}" data-id="${r.i}" ${picked.has(r.i) ? 'checked' : ''} aria-label="${esc(r.m)}"></span>
        <span class="no">${r.i}</span>
        <div class="prod">${prod}</div>
        <div class="meta">
          <span class="cond"><span class="lbl">${t('h_cond')}</span>${esc(r.k ? tx('cond', r.k) : '—')}</span>
          <span>${availPill(r)}${r.l ? `<span class="sub">${t('shipsfrom')} ${esc(tx('loc', r.l))}</span>` : ''}</span>
          <span class="qty"><span class="lbl">${t('h_qty')}</span>${esc(tx('qty', r.q) || '—')}</span>
          ${PRICED ? (r.s != null ? `<span class="price"><span class="lbl">${t('h_price')}</span>${usd(r.s)}</span>` : `<span class="price ask">${t('onreq')}</span>`) : ''}
        </div></div>`;
    }
  });
  const more = res.length > limit ? `<button class="more" id="more" type="button">${t('more').replace('{n}', Math.min(160, res.length - limit)).replace('{left}', res.length - limit)}</button>` : '';
  $('#ledger').innerHTML = res.length ? out + more : `<div class="empty">${t('empty')}</div>`;
  $('#count').innerHTML = t('showing').replace('{a}', `<b>${Math.min(res.length, limit)}</b>`).replace('{b}', `<b>${res.length}</b>`);
  $('#reset').hidden = !($('#q').value || cat !== '' || s2 !== '' || av !== '' || w);
  const m = $('#more'); if (m) m.onclick = () => { limit += 160; render(); };
  xmatch(toks);
  const dir = document.querySelector('details.panel'); if (dir) dir.hidden = toks.length > 0;   /* supplier directory steps aside while searching */
}
function basket(){
  
  const n = picked.size; $('#basket').hidden = n === 0;
  $('#bcount').textContent = t('selected').replace('{n}', n);
  $('#bcopy').textContent = t('bcopy');
}
function requestText(){
  if (MODE === 'wtbdesk') {
    const wl = DATA.filter(r => picked.has(r.i)).map(r => `- ${r.m}${r.p ? ' · P/N ' + r.p : ''} · ${t('h_qty')}: ${tx('qty', r.q) || '—'}${r.t ? ' · ' + tx('lead', r.t) : ''}`);
    return t('req_hello') + '\n\n' + t('req_intro') + '\n' + wl.join('\n') + '\n\n' + t('req_thanks');
  }
  if (MODE === 'wtb') {
    const wl = DATA.filter(r => picked.has(r.i)).map(r => `- ${r.i} · ${r.m}${r.p ? ' · P/N ' + r.p : ''}\n  ${t('yourprice')}: ___ · ${t('yourqty')}: ___ · ${t('yourloc')}: ___ · ${t('yourlead')}: ___`);
    return t('req_hello') + '\n\n' + t('req_intro') + '\n' + wl.join('\n') + '\n\n' + t('req_thanks');
  }
  const lines = DATA.filter(r => picked.has(r.i)).map(r => `- ${r.i} · ${r.m}${r.p ? ' · P/N ' + r.p : ''}${PRICED ? ' · ' + (r.s != null ? usd(r.s) : t('onreq')) : ''} · ${t('qtyneeded')}: ___`);
  return t('req_hello') + '\n\n' + t('req_intro') + '\n' + lines.join('\n') + '\n\n' + t('req_thanks');
}


function setLang(x){ L = x; try { localStorage.setItem('poyraz-lang', x); } catch (e) {} staticText(); render();  }
$('#l-en').onclick = () => setLang('en'); $('#l-tr').onclick = () => setLang('tr');
let tm; $('#q').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { limit = 160; render(); }, 80); });
['#sel2', '#avail'].forEach(s => $(s).addEventListener('change', () => { limit = 160; render(); }));
{
  $('#ledger').addEventListener('change', e => { const id = e.target.dataset && e.target.dataset.id; if (!id) return;
    e.target.checked ? picked.add(id) : picked.delete(id); e.target.closest('.row').classList.toggle('sel', e.target.checked);
    $('#copybox').hidden = true; basket(); });
  $('#bwa').addEventListener('click', e => { const b = e.target.closest('button[data-wa]'); if (!b) return;
    const c = CONTACTS[+b.dataset.wa]; window.open('https://wa.me/' + c.tel.replace(/\D/g, '') + '?text=' + encodeURIComponent(requestText()), '_blank', 'noopener'); });
  $('#bclear').addEventListener('click', () => { picked.clear(); $('#copybox').hidden = true; basket(); render(); });
  $('#bcopy').addEventListener('click', () => { const txt = requestText(), box = $('#copybox'); box.value = txt;
    const show = () => { box.hidden = false; box.focus(); box.select(); $('#bcopy').textContent = t('bselect'); };
    try { navigator.clipboard.writeText(txt).then(() => { $('#bcopy').textContent = t('bcopied'); setTimeout(() => $('#bcopy').textContent = t('bcopy'), 1800); }, show); } catch (e) { show(); } });
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; cat = b.dataset.c; chips(); limit = 160; render(); });
$('#reset').addEventListener('click', () => { $('#q').value = ''; cat = ''; $('#sel2').value = ''; $('#avail').value = ''; chips(); limit = 160; render(); });
staticText(); render(); 
</script>
