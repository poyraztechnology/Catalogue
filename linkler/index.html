<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linkler">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3ECDF">
<title>Linkler</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#F3ECDF;--card:#FFFDF8;--ink:#2B231D;--muted:#76695B;--soft:#A3968A;--line:#E6DAC6;--accent:#7A5A33;--accentBg:#EFE3CF;--ok:#4C7A4A;--okBg:#E6EFDF;--warn:#A8701A;--warnBg:#FBEFD8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 28px)}
main{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:2px 4px 18px}
header img{width:46px;height:46px;border-radius:12px}
header h1{font-size:24px;margin:0;letter-spacing:-.3px}
header p{margin:0;color:var(--muted);font-size:13.5px}
h2{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:22px 6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.05)}
.row{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:11px;background:var(--accentBg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ic svg{width:22px;height:22px}
.ic.blue{background:#E4ECFB;color:#2F6FDE}.ic.green{background:var(--okBg);color:var(--ok)}.ic.amber{background:var(--warnBg);color:var(--warn)}.ic.navy{background:#E3E6EF;color:#0F1B3D}
.tx b{display:block;font-size:15.5px}
.tx small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:7px;background:var(--warnBg);color:var(--warn);margin-left:6px;vertical-align:1px}
.acts{grid-column:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.acts a,.acts button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 13.5px/1 inherit;font-family:inherit;padding:9px 6px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}
.acts a.main{background:var(--ink);color:var(--card);border-color:var(--ink)}
.acts svg{width:15px;height:15px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><div><h1>Linkler</h1><p>Poyraz Technology · katalog ve uygulama linkleri</p></div></header>
<div id="list"></div>
<footer>Linke basınca açılır · Kopyala ile WhatsApp'a yapıştırabilirsin</footer>
</main>
<div id="toast"></div>
<script>
var BASE = 'https://poyraztechnology.github.io/Catalogue/';
var I = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7M8 11h5"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.6"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 8H6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3 3 0 0 1 0 6M21 20a5 5 0 0 0-4-4.9"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5.5 16a3.2 3.2 0 0 1 6 0M14 10h4.5M14 13.5h3"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>',
  receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>'
};
var GROUPS = [
  { t: 'Müşterilere gönder', items: [
    { n: 'Fiyatsız katalog', d: 'Müşteriler ve ekip için ürün kataloğu', u: '', i: 'book', c: 'blue' },
    { n: 'Fiyatlı katalog', d: 'Fiyatların göründüğü katalog', u: 'prices/', i: 'tag', c: 'green' }]},
  { t: 'Tedarikçilere gönder', items: [
    { n: 'Almak istediğimiz ürünler', d: 'Tedarikçilere gönderilen alım listesi', u: 'wanted/', i: 'cart', c: 'amber' }]},
  { t: 'Sadece ekip', items: [
    { n: 'Trade Desk', d: 'Alış fiyatları ve tedarikçiler', u: 'team/', i: 'lock', c: 'navy', tag: 'şifreli' },
    { n: 'Almak istediğimiz – kim istedi', d: 'Hangi müşteri ne istedi', u: 'wanted-team/', i: 'users', c: 'navy', tag: 'şifreli' }]},
  { t: 'Benim', items: [
    { n: 'Dijital kartvizitim', d: 'Gamze Okmen – Poyraz Technology', u: 'gamze/', i: 'card', c: 'blue' },
    { n: 'Katalogları güncelle', d: 'Excel\'i yükleyip linkleri yenileme sayfası', u: 'guncelle/', i: 'refresh', c: 'amber', noShare: true }]},
  { t: 'Uygulamaları yükle', items: [
    { n: 'Kartvizit', d: 'Ekip telefonuna kurulum sayfası', u: 'app/', i: 'card', c: 'navy' },
    { n: 'Faturalar', d: 'Ekip telefonuna kurulum sayfası', u: 'faturalar/', i: 'receipt', c: 'green' }]}
];
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var html = '';
GROUPS.forEach(function (g) {
  html += '<h2>' + esc(g.t) + '</h2><div class="card">' + g.items.map(function (x) {
    var url = BASE + x.u;
    return '<div class="row"><span class="ic ' + x.c + '">' + I[x.i] + '</span><span class="tx"><b>' + esc(x.n) + (x.tag ? '<span class="tag">' + esc(x.tag) + '</span>' : '') +
      '</b><small>' + esc(x.d) + '</small></span><div class="acts"><a class="main" href="' + esc(url) + '" target="_blank" rel="noopener">' + I.open + ' Aç</a>' +
      (x.noShare ? '' : '<button data-copy="' + esc(url) + '">' + I.copy + ' Kopyala</button><button data-share="' + esc(url) + '" data-title="' + esc(x.n) + '">' + I.share + ' Gönder</button>') + '</div></div>';
  }).join('') + '</div>';
});
document.getElementById('list').innerHTML = html;
var toastT;
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 1600); }
function copy(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function (ok, no) {
    var a = document.createElement('textarea'); a.value = text; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); a.setSelectionRange(0, text.length);
    try { document.execCommand('copy') ? ok() : no(); } catch (e) { no(e); } document.body.removeChild(a);
  });
}
document.addEventListener('click', function (e) {
  var c = e.target.closest('[data-copy]'), s = e.target.closest('[data-share]');
  if (c) copy(c.getAttribute('data-copy')).then(function () { toast('Link kopyalandı'); }, function () { toast('Kopyalanamadı'); });
  if (s) {
    var url = s.getAttribute('data-share');
    if (navigator.share) navigator.share({ url: url }).catch(function () {});
    else copy(url).then(function () { toast('Link kopyalandı'); });
  }
});
</script>
</body>
</html>
