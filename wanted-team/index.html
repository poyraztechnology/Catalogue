const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function key(pass, salt){
  const b = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256'}, b, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
}
async function openDesk(pass, remember){
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub(IV)}, await key(pass, ub(SALT)), ub(CT));
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if (remember) { try { localStorage.setItem('poyraz-desk-pass', pass); } catch (e) {} }
  document.open(); document.write(html); document.close();
}
(async () => {
  let s = null; try { s = localStorage.getItem('poyraz-desk-pass'); } catch (e) {}
  if (s) { try { await openDesk(s, false); return; } catch (e) { try { localStorage.removeItem('poyraz-desk-pass'); } catch (_) {} } }
  document.getElementById('p').focus();
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault(); const m = document.getElementById('m'); m.textContent = '';
  try { await openDesk(document.getElementById('p').value, document.getElementById('r').checked); }
  catch (e) { m.textContent = 'Şifre yanlış / Wrong password'; }
});
